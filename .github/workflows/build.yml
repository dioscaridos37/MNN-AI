name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 platforms;android-35 build-tools;34.0.0 build-tools;35.0.0 ndk;25.1.8937393 cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Fetch MNN Android SDK source
        run: git clone --depth 1 https://github.com/AdribMahmud101/mnn-android-sdk.git mnn-sdk
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Create source ZIP from repository root
        run: zip -r MNN-AI-source.zip . -x ".git/*" ".gradle/*" "**/build/*" "MNN-AI-source.zip" "mnn-sdk/.git/*"
      - uses: actions/upload-artifact@v4
        with:
          name: DICAAI-Android-APK
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DICAAI-source-ZIP
          path: MNN-AI-source.zip
