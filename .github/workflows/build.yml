name: DIX AI Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.31.6"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fetch pinned llama.cpp
        run: |
          mkdir -p third_party
          git clone https://github.com/ggml-org/llama.cpp.git third_party/llama.cpp
          git -C third_party/llama.cpp checkout 7d7f0287530bc8981690f361d8c1627dbae1c99a

      - name: Build arm64 APK
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Package source
        run: |
          zip -r DIX-AI-source.zip .             -x ".git/*" ".gradle/*" "**/build/*"             "third_party/llama.cpp/*" "DIX-AI-source.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: DIX-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: DIX-AI-source
          path: DIX-AI-source.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dix-ai-${{ github.run_number }}
          name: DIX AI build #${{ github.run_number }}
          prerelease: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            DIX-AI-source.zip
