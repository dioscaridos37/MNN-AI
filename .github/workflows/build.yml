name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Create source ZIP from repository root
        run: zip -r MNN-AI-source.zip . -x ".git/*" ".gradle/*" "**/build/*" "MNN-AI-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: MNN-AI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MNN-AI-source-zip
          path: MNN-AI-source.zip
